[project]
name = "mech-agent"
version = "0.1.0"
description = "OpenHands plugin for conversational mechanical design (enclosures, mechanisms, brackets)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "build123d==0.11.1",
    "mcp>=1.29,<2",
    "openhands-sdk==1.49.4",
    "openhands-tools==1.49.4",
]

[dependency-groups]
dev = [
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-xdist>=3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mech"]

[tool.uv]
required-version = "==0.12.18"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]
markers = ["slow: tests that build full CAD geometry"]
