[project]
name = "mech-agent"
version = "0.1.0"
description = "OpenHands plugin for conversational mechanical design (enclosures, mechanisms, brackets)"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "build123d==0.13.0",
    "ezdxf==1.4.4",
    "mcp>=1.29,<2",
    "openhands-sdk==1.52.0",
    "openhands-tools==1.52.0",
]

[dependency-groups]
dev = [
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mech"]

[tool.uv]
required-version = "==0.12.23"
# threejs-materials<1.3 (required by build123d>=0.13) caps pillow<12.3,
# which conflicts with openhands-sdk>=1.49.5's pillow>=12.3. threejs-materials
# feeds build123d's viewer/material export only, so overriding the pillow
# bound is safe for the mech generation/gate path.
override-dependencies = ["pillow>=12.3.0,<13"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = ["scripts/structural_coverage.py", "tests/test_structural_coverage.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/mech/hooks/scripts",
    "plugins/mech/scripts",
]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = ["."]
markers = ["slow: tests that build full CAD geometry"]

[tool.coverage.run]
source = ["src/mech"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
# Measured as CI's verify job runs: no rsvg-convert on PATH, so the render
# tests skip. c0 = 83 keeps main's former statement-only fail_under.
c0 = 83
c1 = 68
decision = 60
c2 = 58
mcdc = 33
boundary = 29

[tool.coverage.report]
fail_under = 79
