name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        # uv sync --locked stays sequential: it builds the venv every leg
        # below shares, so the first venv build is never concurrent.
        run: uv sync --locked
      # The five check legs are independent (disjoint output paths) and
      # run as background steps joined by the wait below. They keep their
      # top-level ids (not a parallel: group) so actionlint still resolves
      # them.
      - name: Ruff
        id: ruff
        background: true
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        id: pyright
        background: true
        run: uv run pyright
      - name: Pytest
        id: pytest
        background: true
        # Same command as `verify_all.py --stage fast` so fail_under and the
        # [tool.vibebb-coverage] structural floors gate CI too.
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Docs
        id: docs
        background: true
        run: uv run python scripts/verify_docs.py
      - name: Shared checks
        id: shared-checks
        background: true
        run: |
          git diff --check
          uv run python scripts/check_shared_hooks.py
          uv run python scripts/check_shared_workflows.py

      - name: Wait for check legs
        wait: [ruff, pyright, pytest, docs, shared-checks]

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: verify (3.15)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: true
        with:
          python-version: "3.15"
          cache-suffix: verify-3.15
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: true
        run: uv sync --locked
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        id: pyright
        continue-on-error: true
        run: uv run pyright
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Docs
        id: docs
        continue-on-error: true
        run: uv run python scripts/verify_docs.py
      - name: Shared checks
        id: shared-checks
        continue-on-error: true
        run: |
          git diff --check
          uv run python scripts/check_shared_hooks.py
          uv run python scripts/check_shared_workflows.py
      - name: Report 3.15 canary outcome
        if: always() && (steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.pyright.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.docs.outcome == 'failure' || steps.shared-checks.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/mech-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/mech-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check plugin loads via SDK
        run: uv run python scripts/check_plugin_load.py
