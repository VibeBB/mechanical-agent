name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit X.Y.Z override; leave empty to bump"
        required: false
        type: string
      dry_run:
        description: "Rehearse the release: validate version arithmetic and run the downstream verify/install-smoke/build jobs against HEAD without committing, pushing, tagging, or releasing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    # Covers the slow path: direct-push rejection → bump PR + dispatched
    # checks + merge wait.
    timeout-minutes: 45
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    # actions approves approval-gated runs and dispatches the bump-branch
    # checks; contents pushes the bump commit (or its PR branch);
    # pull-requests opens and merges the version-bump PR.
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version files
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        # The release state machine lives in scripts/release_bump.sh so the
        # dry_run rehearsal path is exercisable under pytest (stubbed gh,
        # local git remotes — see tests/test_release_bump.py).
        run: bash scripts/release_bump.sh

  verify:
    needs: bump-version
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse
    with:
      ref: ${{ needs.bump-version.outputs.sha }}

  install-smoke:
    needs: bump-version
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: install-smoke
      - name: Sync dependencies
        run: uv sync --locked
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.bump-version.outputs.sha }}
        run: >
          uv run python scripts/smoke_install_plugin.py
          --repo VibeBB/mechanical-agent --ref "$REF" --repo-path plugins/mech

  release:
    needs: [bump-version, verify, install-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      # Creates the GitHub release and its v<version> tag.
      contents: write
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      SHA: ${{ needs.bump-version.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - name: Build release zip
        run: |
          mkdir -p dist
          (cd plugins && zip -r "../dist/mech-plugin-v${VERSION}.zip" mech)
      - name: Note dry-run release skip
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run: skipped creating release v${VERSION} at ${SHA}"
      - name: Create release and tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${VERSION}" --target "$SHA"
          --title "mech v${VERSION}" --generate-notes dist/*.zip
