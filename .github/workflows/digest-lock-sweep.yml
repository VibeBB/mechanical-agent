name: Digest lock PR sweep

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-lock-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      # Dispatches the post-merge workflows on main; bot merges do not
      # fire push events.
      actions: write
      contents: write # merges and deletes digest-lock branches
      pull-requests: write # merges stalled digest-lock PRs
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # This job only talks to the GitHub API; block everything else.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Merge stalled digest-lock PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/digest_lock_sweep.sh
