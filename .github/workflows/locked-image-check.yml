name: Locked image check

on:
  push:
    branches: [main]
    # Only run the full pull+attestation+smoke when a lock file it covers
    # actually changed; the publisher dispatches this workflow post-merge
    # and the weekly sweep covers drift, so every other main push is
    # pure cost (~2 min, ~500 MB image pull).
    paths:
      - docker/image-digests.json
      - plugins/mech/skills/mech-workflow/tools-image.json
  schedule:
    - cron: "40 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        env:
          EXPECTED_IMAGE: ghcr.io/vibebb/mech-tools
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("docker/image-digests.json")
          try:
              lock = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid image lock: {exc}") from exc
          if not isinstance(lock, dict):
              raise SystemExit("image lock must be a JSON object")
          entry = lock.get("mech_tools")
          if not isinstance(entry, dict):
              raise SystemExit("image lock entry is missing or malformed: mech_tools")
          if entry.get("image") != os.environ["EXPECTED_IMAGE"]:
              raise SystemExit("image lock entry has an unexpected image: mech_tools")

          digest = entry.get("digest")
          tag = entry.get("tag")
          attestation = entry.get("attestation")
          if digest is None and tag is None:
              if attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an attestation")
              present = False
              attestation = ""
          else:
              if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit("image lock digest must be sha256 followed by 64 lowercase hex digits")
              if digest == f"sha256:{'0' * 64}":
                  raise SystemExit("image lock digest cannot be a placeholder")
              if not isinstance(tag, str) or not re.fullmatch(r"[0-9a-f]{40}-tools", tag):
                  raise SystemExit("image lock tag has an invalid shape")
              if attestation is not None and (
                  not isinstance(attestation, str)
                  or not attestation.startswith("https://")
                  or "\n" in attestation
              ):
                  raise SystemExit("image lock attestation must be an HTTPS URL")
              present = True
              attestation = attestation or ""

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={str(present).lower()}\n")
              output.write(f"attestation={attestation}\n")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: mech_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      attestations: read # verifies provenance for the locked tools image
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: locked-image-check
      - run: uv sync --locked
      - run: uv run python scripts/pull_locked_image.py --entry mech_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry mech_tools)" >> "$GITHUB_OUTPUT"
      - name: Verify tools image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          ATTESTATION: ${{ needs.check-lock.outputs.attestation }}
        run: |
          set -euo pipefail
          if [ -z "$ATTESTATION" ]; then
            echo "::warning::mech_tools lock has no provenance attestation; continuing"
            exit 0
          fi
          image="${IMAGE_REF%@*}"
          digest="${IMAGE_REF#*@}"
          gh attestation verify "oci://${image}@${digest}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-mech-images.yml"
      - name: Warn when tools image has no SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation == ''
        run: echo "::warning::mech_tools image lock has no SBOM attestation; continuing"
      - name: Verify tools image SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          image="${IMAGE_REF%@*}"
          digest="${IMAGE_REF#*@}"
          gh attestation verify "oci://${image}@${digest}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-mech-images.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
      # e2e_authoring exits non-zero unless the gate verdict is "pass"
      # (fail-closed), so the container exit code is the smoke check. The
      # smoke files are mounted from runner temp for failure artifacts.
      - name: Smoke locked image
        env:
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          launcher=plugins/mech/scripts/mech_launcher.py
          out=.launcher-smoke/mech
          mkdir -p "$out"
          if python3 - <<'PY'
          import json
          from pathlib import Path

          entry = json.loads(Path("docker/image-digests.json").read_text(encoding="utf-8"))["mech_tools"]
          raise SystemExit(0 if entry.get("attestation") else 1)
          PY
          then
            export MECH_VERIFY_ATTESTATION=require
          else
            export MECH_VERIFY_ATTESTATION=auto
          fi
          python3 "$launcher" prewarm
          python3 "$launcher" doctor > "$out/doctor.json"
          set +e
          python3 "$launcher" author --brief examples/enclosure.brief.json \
            --out "$out/enclosure" > "$out/author.stdout.json"
          status=$?
          set -e
          python3 - "$out/enclosure" "$out/author.stdout.json" "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          stdout = Path(sys.argv[2])
          status = int(sys.argv[3])
          reports = sorted(output.rglob("*report.json"))
          printed = False
          for report_path in reports:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if isinstance(report, dict) and "checks" in report:
                  print(json.dumps(report["checks"], ensure_ascii=False, indent=2))
                  printed = True
          if not printed:
              print(stdout.read_text(encoding="utf-8"))
          result = json.loads(stdout.read_text(encoding="utf-8"))
          if status != 0 or result.get("verdict") != "pass":
              raise SystemExit("mechanical launcher smoke did not pass")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mech-locked-image-smoke
          path: ${{ github.workspace }}/.launcher-smoke/mech/
          if-no-files-found: ignore
