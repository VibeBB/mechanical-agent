name: Publish mech images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/mech/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/e2e_authoring.py"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - ".github/workflows/publish-mech-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/mech/skills/mech-workflow/tools-image.json"
      - "!docker/README.md"
  workflow_dispatch:
    inputs:
      skip_tools:
        description: "Reuse the locked tools image instead of rebuilding it"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-mech-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # actions approves approval-gated runs and dispatches the lock-branch and
    # post-merge checks; contents pushes the lock branch; packages pushes the
    # ghcr.io images; pull-requests opens and merges the digest-lock PR.
    permissions:
      actions: write
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Resolve source revision
        run: |
          set -euo pipefail
          # The SDK clone tag follows the project pin in pyproject/uv.lock,
          # not a hardcoded version that can drift.
          sdk_version=$(python3 -c \
            "import tomllib; \
             deps = tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; \
             print(next(d.split('==')[1] for d in deps if d.startswith('openhands-sdk==')))")
          if [[ ! "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid SDK version: $sdk_version" >&2
            exit 1
          fi
          echo "SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
      - name: Build and publish tools
        id: tools
        if: inputs.skip_tools != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/mech-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mech-tools:${{ github.sha }}-tools
            ghcr.io/${{ env.IMAGE_OWNER }}/mech-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest tools image provenance
        id: attest
        if: inputs.skip_tools != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/mech-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_tools }}" = true ]; then
            TOOLS_REF=$(uv run python scripts/print_locked_image.py --entry mech_tools)
            uv run python scripts/pull_locked_image.py --entry mech_tools --record "$RUNNER_TEMP/pull-tools.json"
            TOOLS_TAG=$(python3 -c 'import json; print(json.load(open("docker/image-digests.json", encoding="utf-8"))["mech_tools"]["tag"])')
          else
            case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
            TOOLS_REF="ghcr.io/${IMAGE_OWNER}/mech-tools@${BUILT_DIGEST}"
            TOOLS_TAG="${SOURCE_SHA}-tools"
          fi
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$TOOLS_REF" "${TOOLS_REF##*@}" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        if: inputs.skip_tools != true
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: registry
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/mech-tools.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package tools SPDX SBOM
        if: inputs.skip_tools != true
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/mech-tools.full.spdx.json" \
            "$RUNNER_TEMP/mech-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        if: inputs.skip_tools != true
        env:
          SBOM_PATH: ${{ runner.temp }}/mech-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        if: inputs.skip_tools != true
        run: |
          python3 - "${{ runner.temp }}/mech-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        if: inputs.skip_tools != true
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/mech-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/mech-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        if: inputs.skip_tools != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mech-tools-spdx-sbom
          path: ${{ runner.temp }}/mech-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published tools
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/mech-tools.json"
      # e2e_authoring exits non-zero unless the gate verdict is "pass"
      # (fail-closed), so the container exit code is the smoke check. The
      # mounted output is uploaded even when the smoke fails.
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mech-smoke"
          chmod 777 "$RUNNER_TEMP/mech-smoke"
          docker pull "$TOOLS_REF"
          docker run --rm --user mech \
            --volume "$RUNNER_TEMP/mech-smoke:/tmp/mech-smoke" "$TOOLS_REF" \
            python /opt/mech/scripts/e2e_authoring.py \
              --brief /opt/mech/examples/enclosure.brief.json --out /tmp/mech-smoke/enclosure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mech-published-image-smoke
          path: ${{ runner.temp }}/mech-smoke/
          if-no-files-found: ignore
      - name: Clone OpenHands SDK
        run: git clone --depth 1 --branch "v${SDK_VERSION}" https://github.com/OpenHands/software-agent-sdk "$RUNNER_TEMP/sdk"
      - name: Stabilize server build cache tag
        # Upstream keys the registry cache tag on the base-image digest, so
        # every new tools digest opens a fresh (empty) cache namespace and
        # the importer logs "not found" on every publish. The
        # base-image-independent builder/binary-builder/acp-providers stages
        # are the bulk of the server build, so point the cache at a stable
        # per-target tag. Fail-open: if upstream renames the property, build
        # unpatched rather than break.
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/sdk/openhands-agent-server/openhands/agent_server/docker/build.py"
          needle='buildcache-{self.target}-{self.base_image_slug}{self.flavor_suffix}'
          replacement='buildcache-{self.target}{self.flavor_suffix}'
          if grep -qF "$needle" "$f"; then
            sed -i "s/$needle/$replacement/" "$f"
            grep -qF "$replacement" "$f"
            echo "patched: registry cache tag is now buildcache-<target>-main"
          else
            echo "::warning::upstream build.py cache_tags layout changed; building without stable cache tag"
          fi
      - name: Build and publish server
        env:
          SDK_SHA: ${{ github.sha }}
          CUSTOM_TAGS: latest
        run: |
          set -euo pipefail
          uv run --project "$RUNNER_TEMP/sdk" python \
            "$RUNNER_TEMP/sdk/openhands-agent-server/openhands/agent_server/docker/build.py" \
            --base-image "$TOOLS_REF" --image "ghcr.io/${IMAGE_OWNER}/mech-server" \
            --target source --platforms linux/amd64 --push --sdk-project-root "$RUNNER_TEMP/sdk"
      - name: Resolve server digest
        run: |
          set -euo pipefail
          SERVER_TAG="${SOURCE_SHA}-latest-source"
          SERVER_DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "ghcr.io/${IMAGE_OWNER}/mech-server:${SERVER_TAG}" | tr -d '"')
          case "$SERVER_DIGEST" in sha256:*) ;; *) echo "invalid server digest: $SERVER_DIGEST" >&2; exit 1 ;; esac
          printf 'SERVER_TAG=%s\nSERVER_DIGEST=%s\n' "$SERVER_TAG" "$SERVER_DIGEST" >> "$GITHUB_ENV"
          docker buildx imagetools create --tag "ghcr.io/${IMAGE_OWNER}/mech-server:latest" \
            "ghcr.io/${IMAGE_OWNER}/mech-server:${SERVER_TAG}"
      - name: Measure published server
        run: |
          set -euo pipefail
          uv run python scripts/measure_image_tools.py \
            --image-ref "ghcr.io/${IMAGE_OWNER}/mech-server@${SERVER_DIGEST}" \
            --out "$RUNNER_TEMP/mech-server.json"
      - name: Record published image summary
        env:
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          {
            echo "## mech images"
            echo
            if [ "${SKIP_TOOLS:-false}" = true ]; then
              echo "- **tools**: existing locked image (not rebuilt)"
            else
              echo "- **tools**: \`$TOOLS_REF\`"
            fi
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **server**: \`ghcr.io/${IMAGE_OWNER}/mech-server@${SERVER_DIGEST}\`"
            echo "- **server tag**: \`$SERVER_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${SERVER_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          if [ "${SKIP_TOOLS:-false}" != true ]; then
            uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
              --entry mech_tools --image "ghcr.io/${IMAGE_OWNER}/mech-tools" \
              --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
              --workflow-run "$workflow_run" --dockerfile docker/mech-tools.Dockerfile \
              --tools-json "$RUNNER_TEMP/mech-tools.json" \
              --attestation "$ATTESTATION_URL" \
              --sbom-attestation "$SBOM_ATTESTATION_URL"
          fi
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry mech_server --image "ghcr.io/${IMAGE_OWNER}/mech-server" \
            --tag "$SERVER_TAG" --digest "$SERVER_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile "sdk:openhands-agent-server/v${SDK_VERSION}" \
            --tools-json "$RUNNER_TEMP/mech-server.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/skills/*/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["mech_tools"]
          pin = "plugins/mech/skills/mech-workflow/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) so a still-untracked lock
          # file on the very first publish is detected as a change too.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/mech/skills/mech-workflow/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/mech/skills/mech-workflow/tools-image.json
          git commit -m "Update mech image digest lock"
          retry git push --set-upstream origin "$branch"
          if [ "${SKIP_TOOLS:-false}" = true ]; then
            tools_line="tools: locked image (not rebuilt)"
          else
            tools_line="tools: ${TOOLS_REF}"
          fi
          body=$(printf '%s\n' \
            "The publish workflow updated the mech image digest lock." \
            "" \
            "$tools_line" \
            "server: ghcr.io/${IMAGE_OWNER}/mech-server@${SERVER_DIGEST}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update mech image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "" "ci.yml locked-image-check.yml"
